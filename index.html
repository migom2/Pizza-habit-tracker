<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>습관 피자 트래커</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍕</text></svg>" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:wght@500;600&display=swap" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div class="brand">🍕 습관 피자 트래커</div>
        <div class="tag">오늘의 습관을 완성하면 피자 조각이 채워져요</div>
      </header>

      <main class="board">
        <section class="pizza-stage" id="pizza-stage">
          <div class="stage-inner">
            <!-- 피자 -->
            <div class="pizza-wrap" id="pizza-wrap">
              <div class="pizza-plate">
                <div class="pizza" id="pizza"></div>
              </div>
            </div>

            <!-- 완성 시 피자 주변에 반짝이는 장식 -->
            <div class="sparkle-layer" id="sparkle-layer"></div>
          </div>

          <div class="pizza-counter">
            <span id="count-done">0</span><span class="slash">/</span><span id="count-total">8</span>
          </div>

          <p class="complete-msg" id="complete-msg">오늘의 피자 완성! 🎉</p>
        </section>

        <section class="habit-panel">
          <h2>오늘의 습관 <span class="hint">(최대 8개)</span></h2>
          <ul class="habit-list" id="habit-list"></ul>

          <form class="add-form" id="add-form">
            <input type="text" id="add-input" maxlength="20" placeholder="새 습관 이름 (예: 물 2L 마시기)" autocomplete="off" />
            <button type="submit" id="add-btn">추가</button>
          </form>
          <p class="full-hint" id="full-hint">습관 8개가 모두 채워졌어요. 슬롯을 비우면 새로 추가할 수 있어요.</p>

          <div class="stats">
            <div class="stat">
              <div class="stat-num" id="stat-streak">0</div>
              <div class="stat-label">연속 완성일</div>
            </div>
            <div class="stat">
              <div class="stat-num" id="stat-total">0</div>
              <div class="stat-label">누적 완성 피자</div>
            </div>
          </div>

          <button class="reset-btn" id="reset-btn" type="button">오늘 기록 초기화</button>
        </section>
      </main>

      <section class="history">
        <h3>완성한 피자들</h3>
        <div class="history-row" id="history-row">
          <p class="history-empty" id="history-empty">아직 완성한 피자가 없어요. 오늘 습관을 모두 채워보세요!</p>
        </div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
